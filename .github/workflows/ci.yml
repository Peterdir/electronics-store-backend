name: Java CI with Maven

# Kích hoạt CI khi có Push hoặc Pull Request vào các nhánh chính
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn từ repository về máy ảo của GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Tự động cache các thư viện để lần chạy sau nhanh hơn

      # 3. Cấp quyền thực thi cho file Maven Wrapper (trên môi trường Linux)
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      # 4. Biên dịch và chạy kiểm thử
      - name: Build and Test with Maven
        run: ./mvnw clean test
