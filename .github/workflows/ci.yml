name: Java CI with Maven

# Kích hoạt CI khi có Push hoặc Pull Request vào các nhánh chính
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn từ repository về máy ảo của GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Tự động cache các thư viện để lần chạy sau nhanh hơn

      # 3. Cấp quyền thực thi cho file Maven Wrapper (trên môi trường Linux)
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      # 4. Biên dịch và chạy kiểm thử (Unit Tests)
      - name: Build and Run Tests with Maven
        run: ./mvnw clean test

      # 5. Lưu lại Test Report để xem chi tiết khi có lỗi
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always() # Luôn chạy bước này dù test có pass hay fail
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7
